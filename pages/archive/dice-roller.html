    <body>
        <div id="container">
            <div id="top">
                <div id="page-title">
                    <h1>Dice Roller</h1>
                </div>
            </div><br>
            <div id="center">
                <div id="blank-row"></div>
                <div class="content-row">
                    <div class="content">
                        <label id="dice-number-label">How many <b>dice</b>?</label>
                        <input type="text" id="how-many-dice-input"><br><br>
                        <label id="dice-side-nmber-label">How many <b>sides</b>?</label>
                        <input type="text" id="how-many-sides-input"><br><br>
                        <label id="dice-modifier=label-add-subtract">Add a <b>modifier</b> to the total <em>(can be 0)</em></label>
                        <input type="text" id="dice-modifier-input-add-subtract"><br><br>
                        <label id="dice-modifier-label-2">Multiply by a <b>modifier</b>?</label>
                        <input type="text" id="dice-modifier-input-multiply"><br><br>
                        <button type="text" id="submit-button-dice">submit</button>
                        <button type=text" id="reset-button-dice">reset</button>
                        <button type="text" id="reset-input-fields-dice">clear</button><br><br>
                        <label id="dice-result-total">Result (Total): </label><br><br>
                        <label id="dice-result-individual">Result (Individual Dice): </label>
                    </div>
                </div>
            </div>
